# Render Blueprint — backend API (Express + MongoDB Atlas).
# Render dashboard → New → Blueprint → pick this repo. Values marked `sync: false`
# are secrets: Render asks for them on first deploy (they never live in git).
services:
  - type: web
    name: riyadvi-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Client → Vercel rewrite → Render proxy → app: two proxies in front, so the
      # rate limiter must trust two hops to see the visitor's real IP.
      - key: TRUST_PROXY
        value: "2"
      - key: MONGODB_URI # Atlas connection string, e.g. mongodb+srv://user:pass@cluster/riyadvi
        sync: false
      - key: CORS_ORIGINS # e.g. https://riyadvi.vercel.app (comma-separate several)
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH # npm run hash-password -- "<password>"
        sync: false
      - key: JWT_SECRET # 32+ random characters
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: GUIDE_DOWNLOAD_URL
        value: /downloads/riyadvi-software-project-planning-guide.pdf
      # Optional email notifications (leave SMTP_HOST empty to disable)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: "Riyadvi Website <no-reply@riyadvisoftwaretechnologies.com>"
      - key: NOTIFY_TO
        sync: false
